name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Typst is bundled with Quarto, and the LaTeX checks only inspect
      # the generated .tex (no PDF compilation), so no TinyTeX needed.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - name: Run tests
        run: python3 tests/run.py
